name: VeXed v10 - Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VeXed v10.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract VeXed source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(find . -maxdepth 1 -type f -name 'VeXed_v10*.zip' -print | sort)
          if [ "${#ZIP_FILES[@]}" -eq 0 ]; then
            echo "::error::Tidak menemukan VeXed_v10*.zip di root repository."
            echo "Isi repository:"
            ls -la
            exit 1
          fi
          if [ "${#ZIP_FILES[@]}" -gt 1 ]; then
            echo "::error::Ada lebih dari satu arsip VeXed v10. Sisakan satu ZIP source agar tidak salah build."
            printf '%s\n' "${ZIP_FILES[@]}"
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "${ZIP_FILES[0]}" -d extracted

          echo "Isi arsip (maksimal 3 tingkat):"
          find extracted -maxdepth 3 -type f | sort | head -150

          PROJECT_DIR="$(find extracted -type f \\( -name 'settings.gradle.kts' -o -name 'settings.gradle' \\) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Tidak menemukan root project Android. File settings.gradle(.kts) dan app/build.gradle.kts harus berada dalam satu folder project."
            exit 1
          fi

          echo "Project root ditemukan: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          VERSION_NAME="$(grep -E 'versionName[[:space:]]*=' "$PROJECT_DIR/app/build.gradle.kts" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION_CODE="$(grep -E 'versionCode[[:space:]]*=' "$PROJECT_DIR/app/build.gradle.kts" | head -1 | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')"
          echo "Versi source: $VERSION_NAME ($VERSION_CODE)"
          if [ "$VERSION_NAME" != "10.0" ] || [ "$VERSION_CODE" != "20" ]; then
            echo "::error::Source bukan VeXed v10.0. Ditemukan versionName=$VERSION_NAME versionCode=$VERSION_CODE"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Build selesai tetapi APK tidak ditemukan."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/VeXed-v10.0-debug.apk"
          echo "APK berhasil dibuat dari commit: $GITHUB_SHA"
          echo "APK_SOURCE=$PROJECT_DIR/$APK" >> "$GITHUB_ENV"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeXed-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload VeXed v10.0 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeXed-v10.0-debug
          path: output/VeXed-v10.0-debug.apk
          if-no-files-found: error
          retention-days: 14
          
