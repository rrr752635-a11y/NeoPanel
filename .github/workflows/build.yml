name: VeXed v10 - Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VeXed v10.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract VeXed source archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'VeXed_v10*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Arsip VeXed_v10*.zip tidak ditemukan di root repository."
            echo "File di root repository:"
            ls -la
            exit 1
          fi

          mkdir -p source
          unzip -oq "$ZIP_FILE" -d source

          if [ ! -f source/settings.gradle.kts ] && [ ! -f source/settings.gradle ]; then
            echo "::error::Arsip berhasil diekstrak, tetapi settings.gradle(.kts) tidak ditemukan."
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Sumber yang akan dibuild:"
          ls -la source

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd source
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Add build log to summary if build failed
        if: failure()
        shell: bash
        run: |
          echo '### VeXed build failed' >> "$GITHUB_STEP_SUMMARY"
          if [ -f source/build.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -nE '^e: |What went wrong|Execution failed|FAILURE:' -A4 source/build.log | head -100 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Build log was not created. Check the earlier workflow step.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeXed-build-log
          path: source/build.log
          if-no-files-found: ignore

      - name: Upload VeXed v10.0 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VeXed-v10.0-debug
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
